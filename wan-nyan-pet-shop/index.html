<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E" />
<title>わんニャンペットショップ — かわいいペットとふれあう毎日</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #ffe7ef 0%, #f7d9c4 55%, #e9bfa4 100%);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP",
      "IPAPGothic", "IPAGothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    touch-action: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    aspect-ratio: 960 / 600;
    border-radius: 18px;
    box-shadow: 0 18px 48px rgba(120, 78, 60, 0.35);
    touch-action: none;
    image-rendering: auto;
  }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #8a705c; font-size: 18px; font-weight: 700; letter-spacing: 0.08em;
  }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #8a705c; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="600" aria-label="わんニャンペットショップ ゲーム画面"></canvas></div>
<div id="boot">よみこみちゅう…</div>
<noscript>このゲームを あそぶには JavaScript を有効にしてください。</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
